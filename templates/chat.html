<!DOCTYPE html>
<html>
<head>
    <title>Flask Chat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .chat-container { max-width: 800px; margin: auto; }
        .header { margin-bottom: 20px; }
        .chat-box { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; margin-bottom: 20px; }
        .message { margin: 10px 0; padding: 8px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .bot { background: #f5f5f5; text-align: left; }
        .prompt-container { margin-top: 20px; }
        textarea { width: 100%; max-width: 780px; }
        .form-group { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h2>Flask Chat</h2>
            <form method="post">
                <div class="form-group">
                    <label>Host: <input name="host" value="{{ host }}" size="20"></label>
                </div>
                <div class="form-group">
                    <label>Model: 
                        <select name="model" onchange="this.form.submit()">
                            {% for model in models %}
                                <option value="{{ model }}" {% if model == selected_model %}selected{% endif %}>
                                    {{ model }}
                                </option>
                            {% endfor %}
                        </select>
                    </label>
                </div>
        </div>
        <div class="chat-box">
            {% for msg in chat_history %}
                <div class="message user">{{ msg.user }}</div>
                <div class="message bot">{{ msg.bot|safe }}</div>
            {% endfor %}
        </div>
        <div class="prompt-container">
                <textarea name="prompt" rows="4" placeholder="Type your message here..."></textarea><br>
                <input type="submit" value="Send">
            </form>
        </div>
    </div>
</body>
</html>
